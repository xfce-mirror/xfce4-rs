[package.version]
workspace = true

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.keywords]
workspace = true

[package.metadata.system-deps.libxfconf_0]
name = "libxfconf-0"
version = "4.20"

[package.metadata.system-deps.libxfconf_0.v4_21_1]
