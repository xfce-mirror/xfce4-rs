[package]
name = "libxfce4util-sys"
description = "FFI bindings to libxfce4util"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
build = "build.rs"
links = "xfce4util"
categories = [
    "external-ffi-bindings",
    "gui",
]

[package.metadata.system-deps.libxfce4util_1]
name = "libxfce4util-1.0"
version = "4.20"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
all-features = true
features = ["dox"]

[lib]
name = "libxfce4util_sys"

[dependencies]
gio-sys.workspace = true
glib-sys.workspace = true
gobject-sys.workspace = true
libc.workspace = true

[build-dependencies]
system-deps.workspace = true

[dev-dependencies]
shell-words.workspace = true
tempfile.workspace = true

[features]
dox = []
