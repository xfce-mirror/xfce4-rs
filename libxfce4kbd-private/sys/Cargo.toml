[package]
name = "libxfce4kbd-private-sys"
description = "FFI bindings to libxfce4kbd-private"
build = "build.rs"
links = "xfce4kbd-private-3"
categories = ["external-ffi-bindings", "gui"]

[package.version]
workspace = true

[package.authors]
workspace = true

[package.edition]
workspace = true

[package.license]
workspace = true

[package.homepage]
workspace = true

[package.repository]
workspace = true

[package.keywords]
workspace = true

[package.metadata.system-deps.libxfce4kbd_private_3]
name = "libxfce4kbd-private-3"
version = "4.20"

[package.metadata.system-deps.libxfce4kbd_private_3.v4_21_4]
version = "4.21.4"

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
rustdoc-args = ["--cfg", "docsrs", "--generate-link-to-definition"]
all-features = true
features = ["dox"]

[lib]
name = "libxfce4kbdprivate_sys"

[dependencies]
libc = "0.2"

[dependencies.glib-sys]
workspace = true

[dependencies.gobject-sys]
workspace = true

[dependencies.gtk-sys]
workspace = true

[dependencies.libxfce4ui]
package = "libxfce4ui-sys"
path = "../../libxfce4ui/sys"
version = "0.2.2"

[build-dependencies]
system-deps = "9"

[dev-dependencies]
shell-words = "1.0.0"
tempfile = "3"

[features]
dox = []
v4_21_4 = []
